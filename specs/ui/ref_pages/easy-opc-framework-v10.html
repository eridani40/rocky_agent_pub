
<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EASY OPC — 配置中心 · 首页 v10</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=JetBrains+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ── design tokens (shared across all 5 pages) ── */
:root {
  --accent: #D97757; --accent-hover: #C25E3F; --accent-light: #F4E5DE; --accent-surface: #FBF1ED;
  --sage: #5B7A6B; --sage-light: #E3F0E8; --gold: #B89160; --gold-light: #F5E8D5; --indigo: #3730A3;
  --bg: #FAF6F0; --bg-warm: #F0EEE6; --surface: #FAF9F6; --surface-2: #FFFDF8;
  --fg: #1A1A1A; --fg-2: #3D3929; --fg-3: #5C5A52; --muted: #87867F; --muted-2: #6B6A63;
  --border: #E3E1DA; --border-2: #D9D6CE; --border-strong: #C7C4BB;
}
[data-theme="dark"] {
  --accent: #E0916F; --accent-hover: #D97757; --accent-light: #3D2E26; --accent-surface: #2A1F1A;
  --sage: #7A9B8C; --sage-light: #1E2D27; --gold: #D4AB78; --gold-light: #2E2519; --indigo: #818CF8;
  --bg: #1A1816; --bg-warm: #232120; --surface: #1E1C1A; --surface-2: #252321;
  --fg: #F0EDE8; --fg-2: #D8D4CE; --fg-3: #B5B0A8; --muted: #807C75; --muted-2: #9A9590;
  --border: #353231; --border-2: #423E3C; --border-strong: #555150;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--fg); font-family: 'Inter', system-ui, sans-serif; font-size: 14px; line-height: 1.5; height: 100vh; overflow: hidden; }
.mono { font-family: 'JetBrains Mono', monospace; }
.app-root { display: flex; height: 100vh; }

/* ── icon-nav shell (shared) ── */
.icon-nav { width: 56px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 14px 0; }
.brand { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); display: flex; align-items: center; justify-content: center; color: white; font-family: 'Playfair Display', serif; font-weight: 700; font-size: 16px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(217,119,87,0.3); text-decoration: none; }
.nav-spacer { flex: 1; }
.nav-icon { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s; position: relative; color: var(--muted); margin-bottom: 4px; }
.nav-icon:hover { background: var(--accent-surface); color: var(--accent); }
.nav-icon.active { background: var(--accent-surface); color: var(--accent); }
.nav-icon.active::before { content: ''; position: absolute; left: -8px; top: 50%; transform: translateY(-50%); width: 3px; height: 20px; background: var(--accent); border-radius: 0 3px 3px 0; }
.nav-tooltip { position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%); background: var(--fg); color: var(--surface); font-size: 11px; padding: 4px 10px; border-radius: 6px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity 0.15s; z-index: 100; font-family: 'JetBrains Mono', monospace; }
.nav-icon:hover .nav-tooltip { opacity: 1; }
.theme-toggle { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.15s; color: var(--muted); }
.theme-toggle:hover { background: var(--bg-warm); color: var(--fg); }

/* ── shared primitives ── */
.config-area { flex: 1; overflow-y: auto; display: flex; flex-direction: column; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; transition: all 0.15s; border: none; outline: none; font-family: 'Inter', sans-serif; white-space: nowrap; text-decoration: none; }
.btn-primary { background: var(--accent); color: white; }
.btn-primary:hover { background: var(--accent-hover); }
.badge { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 4px; font-size: 10px; font-weight: 600; font-family: 'JetBrains Mono', monospace; letter-spacing: 0.03em; }
.badge-default { background: var(--accent-light); color: var(--accent); }
.provider-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; display: flex; align-items: center; gap: 14px; cursor: pointer; transition: all 0.15s; }
.provider-card:hover { border-color: var(--border-strong); box-shadow: 0 2px 12px rgba(60,50,30,0.05); }
.provider-logo { width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; flex-shrink: 0; font-family: 'Playfair Display', serif; color: white; }
.provider-info { flex: 1; min-width: 0; }
.provider-name { font-size: 14px; font-weight: 600; color: var(--fg); margin-bottom: 3px; display: flex; align-items: center; gap: 8px; }
.provider-desc { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; }

/* ── overview page ── */
.overview-wrap { padding: 44px 48px; max-width: 860px; width: 100%; margin: 0 auto; }
.overview-head { margin-bottom: 22px; }
.overview-title { font-family: 'Playfair Display', serif; font-size: 34px; font-weight: 700; color: var(--fg); letter-spacing: -0.02em; }
.overview-sub { font-size: 12px; color: var(--muted); margin-top: 6px; font-family: 'JetBrains Mono', monospace; }
.rocky-card { display: flex; align-items: center; gap: 16px; background: var(--surface-2); border: 1px solid var(--border); border-radius: 14px; padding: 16px 20px; margin-bottom: 24px; }
.rocky-avatar { width: 48px; height: 48px; border-radius: 12px; object-fit: cover; flex-shrink: 0; background: var(--bg-warm); }
.rocky-name { font-size: 17px; font-weight: 700; color: var(--fg); display: flex; align-items: center; gap: 8px; }
.rocky-role { font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; margin-top: 3px; }
.overview-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.overview-card { padding: 18px 20px; }
.overview-card:hover { border-color: var(--accent); }
.overview-foot { margin-top: 28px; font-size: 11px; color: var(--muted); font-family: 'JetBrains Mono', monospace; line-height: 1.7; }

::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--muted); }
.fade-in { animation: fadeIn 0.25s ease-out; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
</style>
<script>document.documentElement.setAttribute('data-theme', localStorage.getItem('eopc-theme')||'light');</script>
</head>
<body>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const ROCKY_ICON = 'https://maas-log-prod.cn-wlcb.ufileos.com/anthropic/aac13ca6-3443-4ba1-ac85-653820c1eb2e/mqnbsjh8-icon.png?UCloudPublicKey=TOKEN_e15ba47a-d098-4fbd-9afc-a0dcf0e4e621&Expires=1782020314&Signature=9c7rkQqS4BKhhCjxPiljtPOyc3Y=';

const NAV_LINKS = [
  { id:'chat', label:'会话', icon:'chat', href:'mqnbr367-easy-opc-chat-v9a.html' },
  { id:'app', label:'用户设置', icon:'user', href:'easy-opc-app-config-v10.html' },
  { id:'plugin', label:'插件设置', icon:'plugin', href:'easy-opc-plugin-config-v10.html' },
  { id:'dev', label:'系统设置', icon:'dev', href:'easy-opc-dev-config-v10.html' },
  { id:'skill', label:'Skill', icon:'skill', href:'easy-opc-skill-v10.html' },
];

function Icon({ name, size = 18 }) {
  const icons = {
    chat:<g><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></g>,
    user:<g><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a8 8 0 0116 0v1"/></g>,
    plugin:<g><path d="M14 2v6h6"/><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/></g>,
    dev:<g><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><path d="M3.27 6.96L12 12l8.73-5.04"/><path d="M12 22V12"/></g>,
    sun:<g><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></g>,
    moon:<g><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></g>,
    chevronRight:<g><path d="M9 18l6-6-6-6"/></g>,
    arrowRight:<g><path d="M5 12h14M13 6l6 6-6 6"/></g>,
    skill:<g><path d="M12 2L14 10 22 12 14 14 12 22 10 14 2 12 10 10Z"/></g>,
  };
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{icons[name]}</svg>;
}

function AppShell({ current, children }) {
  const [theme, setTheme] = useState(() => localStorage.getItem('eopc-theme') || 'light');
  useEffect(() => { document.documentElement.setAttribute('data-theme', theme); }, [theme]);
  const toggleTheme = () => setTheme(t => { const n = t === 'light' ? 'dark' : 'light'; localStorage.setItem('eopc-theme', n); return n; });
  return (
    <div className="app-root">
      <nav className="icon-nav">
        <a className="brand" href="easy-opc-framework-v10.html" title="EASY OPC · 首页">E</a>
        {NAV_LINKS.map(item => (
          <div key={item.id} className={"nav-icon " + (current === item.id ? 'active' : '')} onClick={() => { location.href = item.href; }}>
            <Icon name={item.icon} size={20} />
            <span className="nav-tooltip">{item.label}</span>
          </div>
        ))}
        <div className="nav-spacer" />
        <div className="theme-toggle" onClick={toggleTheme} title="切换主题">
          <Icon name={theme === 'light' ? 'moon' : 'sun'} size={18} />
        </div>
      </nav>
      {children}
    </div>
  );
}

function OverviewPage() {
  const cards = [
    { id:'chat', icon:'chat', title:'会话', desc:'与 Rocky 对话 · 工具调用流', href:'mqnbr367-easy-opc-chat-v9a.html', tag:'就绪', color:'var(--accent)' },
    { id:'app', icon:'user', title:'用户设置', desc:'LLM 请求 · 界面外观 · 模型配置', href:'easy-opc-app-config-v10.html', tag:'3 组', color:'var(--sage)' },
    { id:'plugin', icon:'plugin', title:'插件设置', desc:'插件启用 · 扩展点编排', href:'easy-opc-plugin-config-v10.html', tag:'3 个', color:'var(--gold)' },
    { id:'dev', icon:'dev', title:'系统设置', desc:'调试 · 存储 · 可观测性', href:'easy-opc-dev-config-v10.html', tag:'3 组', color:'var(--indigo)' },
  ];
  return (
    <main className="config-area fade-in">
      <div className="overview-wrap">
        <div className="overview-head">
          <div className="overview-title">EASY OPC</div>
          <div className="overview-sub">// 配置中心 · framework v10 · 拆分为 5 个独立可编辑页面</div>
        </div>

        <div className="rocky-card">
          <img className="rocky-avatar" src={ROCKY_ICON} alt="Rocky" onError={(e) => { e.target.onerror = null; e.target.src = 'mqnbsjh8-icon.png'; }} />
          <div style={{ flex: 1 }}>
            <div className="rocky-name">Rocky <span className="badge badge-default">Agent</span></div>
            <div className="rocky-role">EASY OPC Agent · claude-3-5-sonnet · 你的桌面助手</div>
          </div>
          <a className="btn btn-primary" href="mqnbr367-easy-opc-chat-v9a.html">与 Rocky 对话 <Icon name="arrowRight" size={12} /></a>
        </div>

        <div className="overview-grid">
          {cards.map(c => (
            <div key={c.id} className="provider-card overview-card" onClick={() => { location.href = c.href; }}>
              <div className="provider-logo" style={{ background: c.color }}><Icon name={c.icon} size={18} /></div>
              <div className="provider-info">
                <div className="provider-name">{c.title} <span className="badge badge-default">{c.tag}</span></div>
                <div className="provider-desc">{c.desc}</div>
              </div>
              <Icon name="chevronRight" size={16} />
            </div>
          ))}
        </div>

        <div className="overview-foot">
          framework-v10.html · chat-v9a.html · app-config-v10 · plugin-config-v10 · dev-config-v10<br/>
          5 个自包含页面 · 共享外壳内联 · 主题跨页同步 (localStorage)
        </div>
      </div>
    </main>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<AppShell current="framework"><OverviewPage /></AppShell>);
</script>
</body>
</html>
