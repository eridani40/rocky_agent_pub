.pv-modal { background: var(--surface); border: 1px solid var(--border-2); border-radius: 14px; box-shadow: 0 20px 56px rgba(40,30,20,0.24); width: 820px; max-width: 94vw; height: 560px; max-height: 88vh; display: flex; flex-direction: column; overflow: hidden; }
.pv-header { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }

.pv-item:hover { background: var(--bg-warm); }

@keyframes fadeIn { from { opacity:0; transform: translateY(8px); } to { opacity:1; transform: translateY(0); } }

<script type="text/babel">
const { useState, useRef, useEffect } = React;

const NAV_LINKS = [
  { id:'chat', label:'会话', icon:'chat', href:'mqnbr367-easy-opc-chat-v9a.html' },
  { id:'app', label:'用户设置', icon:'user', href:'easy-opc-app-config-v10.html' },

  { id:'skill', label:'Skill', icon:'skill', href:'easy-opc-skill-v10.html' },

function Icon({ name, size = 16 }) {
  const icons = {
    chat:<g><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></g>,

    dev:<g><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/><path d="M3.27 6.96L12 12l8.73-5.04"/><path d="M12 22V12"/></g>,
    skill:<g><path d="M12 2L14 10 22 12 14 14 12 22 10 14 2 12 10 10Z"/></g>,
    sun:<g><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></g>,
    moon:<g><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></g>,

    trash:<g><path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></g>,
    file:<g><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/></g>,
    folder:<g><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></g>,
    folderOpen:<g><path d="M3 7a2 2 0 012-2h4l2 3h8a2 2 0 012 2v1H3z"/><path d="M3 11h19l-2 7a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></g>,
    chevronRight:<g><path d="M9 18l6-6-6-6"/></g>,
    eye:<g><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></g>,
    upload:<g><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></g>,
  };
  return <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">{icons[name]}</svg>;
}

function AppShell({ current, children }) {
  const [theme, setTheme] = useState(() => localStorage.getItem('eopc-theme') || 'light');
  useEffect(() => { document.documentElement.setAttribute('data-theme', theme); }, [theme]);
  const toggleTheme = () => setTheme(t => { const n = t === 'light' ? 'dark' : 'light'; localStorage.setItem('eopc-theme', n); return n; });
  return (
    <div className="app-root">
      <nav className="icon-nav">
        <a className="brand" href="easy-opc-framework-v10.html" title="EASY OPC · 首页">E</a>
        {NAV_LINKS.map(item => (
          <div key={item.id} className={"nav-icon " + (current === item.id ? 'active' : '')} onClick={() => { location.href = item.href; }}>
            <Icon name={item.icon} size={20} />
            <span className="nav-tooltip">{item.label}</span>
          </div>
        ))}
        <div className="nav-spacer" />
        <div className="theme-toggle" onClick={toggleTheme} title="切换主题">
          <Icon name={theme === 'light' ? 'moon' : 'sun'} size={18} />
        </div>
      </nav>
      {children}
    </div>

}

// 解析 SKILL.md 顶部的 YAML frontmatter（name / description）
function parseFrontmatter(text) {
  const m = text.match(/^---\s*\n([\s\S]*?)\n---/);
  if (!m) return {};
  const out = {};
  m[1].split('\n').forEach(line => {
    const idx = line.indexOf(':');
    if (idx > -1) {
      const k = line.slice(0, idx).trim();
      const v = line.slice(idx + 1).trim().replace(/^["']|["']$/g, '');
      if (k) out[k] = v;
    }
  });
  return out;
}

// 读取文件为文本（Promise）
function readAsText(file) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = () => res(String(r.result || ''));
    r.onerror = () => res('');
    r.readAsText(file);
  });
}
// 从扁平路径构建树；每个文件节点带 _getContent() 懒读取
function buildTreeFromPaths(rootName, paths) {
  const root = { type: 'dir', name: rootName, children: [] };
  paths.forEach(p => {
    const parts = String(p.path).split('/').filter(Boolean);
    let cur = root.children;
    parts.forEach((part, i) => {
      const isFile = i === parts.length - 1;
      let node = cur.find(n => n.name === part && (isFile ? n.type === 'file' : n.type === 'dir'));
      if (!node) {
        node = isFile ? { type: 'file', name: part, _getContent: p.getContent } : { type: 'dir', name: part, children: [] };
        cur.push(node);
      }
      if (!isFile) cur = node.children;
    });
  });
  return root;
}
// 判断扁平路径是否有公共顶层文件夹（决定 root 名 / 是否剥离首段）
function deriveRoot(paths) {
  if (!paths.length) return { rootName: 'skill', strip: 0 };
  const firsts = paths.map(p => String(p).split('/')[0]);
  const top = firsts[0];
  const same = firsts.every(x => x === top) && paths.some(p => p.includes('/'));
  return same ? { rootName: top, strip: 1 } : { rootName: 'skill', strip: 0 };
}
function findNode(node, pred) {
  if (pred(node)) return node;
  for (const c of (node.children || [])) { const f = findNode(c, pred); if (f) return f; }
  return null;
}
// 从构建好的树里找 SKILL.md → 解析 frontmatter → 入库
async function finalizeSkill(root, fallbackName, addSkill) {
  let name = fallbackName, description = '（未提供介绍）';
  const sm = findNode(root, n => n.type === 'file' && /^skill\.md$/i.test(n.name));
  if (sm) {
    try {
      const text = sm.content != null ? sm.content : (sm._getContent ? await sm._getContent() : '');
      const fm = parseFrontmatter(text);
      if (fm.name) name = fm.name;
      if (fm.description) description = fm.description;
    } catch (e) {}
  }
  addSkill(name, description, root);
}
// .zip / .skill —— 当作压缩包解压
async function installFromArchive(file, addSkill) {
  if (!window.JSZip) { addSkill(file.name.replace(/\.[^.]+$/, ''), '（JSZip 未加载，无法解压 ' + file.name + '）', { type: 'file', name: file.name, content: '' }); return; }
  try {
    const zip = await JSZip.loadAsync(file);
    const entries = [];
    zip.forEach((rel, obj) => { if (!obj.dir) entries.push({ rel, obj }); });
    if (!entries.length) return;
    const info = deriveRoot(entries.map(e => e.rel));
    const paths = entries.map(e => ({ path: e.rel.split('/').slice(info.strip).join('/'), getContent: () => e.obj.async('string').catch(() => '') })).filter(p => p.path);
    const root = buildTreeFromPaths(info.rootName, paths);
    finalizeSkill(root, file.name.replace(/\.(zip|skill)$/i, ''), addSkill);
  } catch (e) {
    addSkill(file.name.replace(/\.[^.]+$/, ''), '（无法解析 ' + file.name + '）', { type: 'file', name: file.name, content: '' });
  }
}
// 文件夹（webkitdirectory）
function installFromFolder(fileList, addSkill) {
  if (!fileList || !fileList.length) return;
  const first = fileList[0].webkitRelativePath || fileList[0].name;
  const top = first.split('/')[0];
  const paths = [];
  Array.from(fileList).forEach(f => {
    const rel = (f.webkitRelativePath || f.name).split('/').slice(1).join('/');
    if (rel) paths.push({ path: rel, getContent: () => readAsText(f) });
  });
  if (!paths.length) return;
  const root = buildTreeFromPaths(top, paths);
  finalizeSkill(root, top, addSkill);
}
// 单个文件：.md 走 frontmatter；.zip/.skill 走解压；其它直接入列
function installFiles(files, addSkill) {
  Array.from(files).forEach(f => {
    const lower = f.name.toLowerCase();
    if (/\.(zip|skill)$/.test(lower)) {
      installFromArchive(f, addSkill);
    } else if (lower.endsWith('.md') || f.type === 'text/markdown') {
      readAsText(f).then(text => {
        const fm = parseFrontmatter(text);
        addSkill(fm.name || f.name.replace(/\.md$/i, ''), fm.description || '（未提供介绍）', { type: 'file', name: f.name, content: text });
      });
    } else {
      addSkill(f.name.replace(/\.[^.]+$/, ''), '已导入文件 · ' + f.name, { type: 'file', name: f.name, content: '' });
    }
  });
}
// 拖拽：拖文件夹才走目录遍历；拖文件（.zip/.skill/.md…）走 installFiles 正确路由
async function installFromDataTransfer(dataTransfer, addSkill) {
  const items = dataTransfer.items;
  if (items && items.length && items[0].webkitGetAsEntry) {
    const entries = [];
    for (let i = 0; i < items.length; i++) { const e = items[i].webkitGetAsEntry(); if (e) entries.push(e); }
    const hasDir = entries.some(e => e.isDirectory);
    if (hasDir) {
      const acc = [];
      for (const e of entries) await walkEntry(e, '', acc);
      if (acc.length) {
        const info = deriveRoot(acc.map(a => a.path));
        const paths = acc.map(a => ({ path: a.path.split('/').slice(info.strip).join('/'), getContent: a.getContent })).filter(p => p.path);
        const root = buildTreeFromPaths(info.rootName, paths);
        finalizeSkill(root, info.rootName, addSkill);
        return;
      }
    }
  }
  installFiles(dataTransfer.files, addSkill);
}
function readAllEntries(dirReader) {
  return new Promise(resolve => {
    const out = [];
    const read = () => dirReader.readEntries(batch => { if (!batch.length) resolve(out); else { out.push(...batch); read(); } }, () => resolve(out));
    read();
  });
}
function walkEntry(entry, prefix, acc) {
  const path = prefix ? prefix + '/' + entry.name : entry.name;
  if (entry.isFile) {
    acc.push({ path, getContent: () => new Promise(res => entry.file(f => readAsText(f).then(res), () => res(''))) });
    return Promise.resolve();
  }
  if (entry.isDirectory) {
    return readAllEntries(entry.createReader()).then(entries => Promise.all(entries.map(e => walkEntry(e, path, acc))));
  }
  return Promise.resolve();
}

function findFirstFile(node, prefix) {
  const path = (prefix ? prefix + '/' : '') + node.name;
  if (node.type === 'file') return { path, node };
  for (const c of (node.children || [])) {
    const f = findFirstFile(c, path);
    if (f) return f;
  }
  return null;
}
function collectDirs(node, prefix, out) {
  const path = (prefix ? prefix + '/' : '') + node.name;
  if (node.type === 'dir') {
    out[path] = true;
    (node.children || []).forEach(c => collectDirs(c, path, out));
  }
  return out;
}

function SkillPage() {
  const [skills, setSkills] = useState(MOCK_SKILLS);
  const [preview, setPreview] = useState(null);
  const [delTarget, setDelTarget] = useState(null);
  const [dragOver, setDragOver] = useState(false);
  const fileInput = useRef(null);
  const folderInput = useRef(null);

  const uid = () => 'sk_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
  const addSkill = (name, description, root) => setSkills(prev => [{ id: uid(), name, description: description || '（未提供介绍）', enabled: true, root }, ...prev]);
  const toggleSkill = (id) => setSkills(prev => prev.map(s => s.id === id ? { ...s, enabled: !s.enabled } : s));
  const deleteSkill = (id) => { setSkills(prev => prev.filter(s => s.id !== id)); setDelTarget(null); };

  const onPickFiles = (e) => { installFiles(e.target.files, addSkill); e.target.value = ''; };
  const onPickFolder = (e) => { installFromFolder(e.target.files, addSkill); e.target.value = ''; };
  const onDrop = (e) => { e.preventDefault(); setDragOver(false); installFromDataTransfer(e.dataTransfer, addSkill); };

  return (
    <main className="config-area fade-in">
      <div className="config-header">
        <div>
          <div className="config-title">Skill 管理</div>
          <div className="config-desc">skill · 安装 / 启用 / 预览 / 删除</div>
        </div>
      </div>
      <div className="config-body">
        <div className="skill-tabs">
          <div className="skill-tab active">Skill 管理</div>
        </div>

        <div className={"drop-zone " + (dragOver ? 'over' : '')}
          onDragOver={e => { e.preventDefault(); setDragOver(true); }}
          onDragLeave={() => setDragOver(false)}
          onDrop={onDrop}>
          <div className="drop-icon"><Icon name="upload" size={20} /></div>
          <div className="drop-title">拖拽 Skill 到此处安装</div>
          <div className="drop-sub">支持 文件夹 · .zip · .skill 包（自动解析 SKILL.md）</div>
          <div className="drop-actions">
            <button className="btn btn-secondary" onClick={e => { e.stopPropagation(); fileInput.current && fileInput.current.click(); }}><Icon name="file" size={12} /> 选择文件</button>
            <button className="btn btn-secondary" onClick={e => { e.stopPropagation(); folderInput.current && folderInput.current.click(); }}><Icon name="folder" size={12} /> 选择文件夹</button>
          </div>
          <input ref={fileInput} type="file" accept=".zip,.skill,.md,.json,.txt" multiple style={{ display: 'none' }} onChange={onPickFiles} />
          <input ref={folderInput} type="file" multiple style={{ display: 'none' }} onChange={onPickFolder} {...{ webkitdirectory: '', directory: '' }} />
        </div>

        <div className="skill-list">
          {skills.length === 0 && <div className="skill-empty">还没有已安装的 Skill</div>}
          {skills.map(s => (
            <div key={s.id} className="skill-card">
              <div className="skill-logo"><Icon name="skill" size={18} /></div>
              <div className="skill-info">
                <div className="skill-name">{s.name} {s.enabled ? <span className="badge badge-enabled">已启用</span> : <span className="badge badge-disabled">已禁用</span>}</div>
                <div className="skill-desc">{s.description}</div>
              </div>
              <div className="skill-controls">
                <div className={"toggle " + (s.enabled ? 'on' : '')} onClick={() => toggleSkill(s.id)} title="启用 / 禁用" />
                <button className="btn btn-secondary" onClick={() => setPreview(s)}><Icon name="eye" size={12} /> 预览</button>
                <button className="del-btn" onClick={() => setDelTarget(s)} title="删除"><Icon name="trash" size={14} /></button>
              </div>
            </div>
          ))}
        </div>
      </div>

      {preview && <SkillPreview skill={preview} onClose={() => setPreview(null)} />}
      {delTarget && (
        <div className="modal-overlay" onClick={() => setDelTarget(null)}>
          <div className="modal" onClick={e => e.stopPropagation()}>
            <div className="modal-header">
              <div className="modal-title">删除 Skill</div>
              <div className="modal-close" onClick={() => setDelTarget(null)}><Icon name="close" size={16} /></div>
            </div>
            <div className="modal-body">确定要删除 <strong style={{ color: 'var(--fg)' }}>{delTarget.name}</strong> 吗？该 Skill 将不再可用，此操作无法撤销。</div>
            <div className="modal-footer">
              <button className="btn btn-secondary" onClick={() => setDelTarget(null)}>取消</button>
              <button className="btn btn-danger" onClick={() => deleteSkill(delTarget.id)}>确认删除</button>
            </div>
          </div>
        </div>
      )}
    </main>
  );
}

function SkillPreview({ skill, onClose }) {
  const [expanded, setExpanded] = useState(() => collectDirs(skill.root, '', {}));
  const [sel, setSel] = useState(() => findFirstFile(skill.root, ''));
  const [content, setContent] = useState('');
  const [loading, setLoading] = useState(false);

  useEffect(() => {
    let cancelled = false;
    if (!sel) { setContent(''); return; }
    const node = sel.node;
    if (node.content != null) { setContent(node.content); return; }
    if (node._getContent) {
      setLoading(true); setContent('');
      node._getContent().then(t => { if (!cancelled) { setContent(t || ''); setLoading(false); } });
      return () => { cancelled = true; };
    }
    setContent('');
  }, [sel]);

  return (
    <div className="pv-overlay" onClick={onClose}>
      <div className="pv-modal" onClick={e => e.stopPropagation()}>
        <div className="pv-header">
          <div className="pv-title"><Icon name="skill" size={15} /> {skill.name}</div>
          <div className="modal-close" onClick={onClose}><Icon name="close" size={16} /></div>
        </div>
        <div className="pv-body">
          <div className="pv-tree">
            <FileTreeNode node={skill.root} depth={0} prefix="" expanded={expanded} setExpanded={setExpanded} activePath={sel && sel.path} onSelect={(path, node) => setSel({ path, node })} />
          </div>
          <div className="pv-content">
            {sel ? (
              <React.Fragment>
                <div className="pv-filepath mono">{sel.path}</div>
                <pre className="pv-pre">{loading ? '（加载中…）' : (content || '（空文件 / 二进制）')}</pre>
              </React.Fragment>
            ) : <div className="pv-empty">选择左侧文件查看内容</div>}
          </div>
        </div>
      </div>
    </div>
  );
}

function FileTreeNode({ node, depth, prefix, expanded, setExpanded, activePath, onSelect }) {
  const path = (prefix ? prefix + '/' : '') + node.name;
  if (node.type === 'dir') {
    const open = !!expanded[path];
    return (
      <div>
        <div className="pv-item" style={{ paddingLeft: 6 + depth * 14 }} onClick={() => setExpanded(p => ({ ...p, [path]: !p[path] }))}>
          <span className={"pv-twisty " + (open ? 'open' : '')}><Icon name="chevronRight" size={10} /></span>
          <span className="pv-ico dir"><Icon name={open ? 'folderOpen' : 'folder'} size={13} /></span>
          <span className="pv-name">{node.name}</span>
        </div>
        {open && (node.children || []).map((c, i) => (
          <FileTreeNode key={i} node={c} depth={depth + 1} prefix={path} expanded={expanded} setExpanded={setExpanded} activePath={activePath} onSelect={onSelect} />
        ))}
      </div>
    );
  }
  const isActive = activePath === path;
  return (
    <div className={"pv-item file " + (isActive ? 'active' : '')} style={{ paddingLeft: 6 + depth * 14 + 14 }} onClick={() => onSelect(path, node)}>
      <span className="pv-ico file"><Icon name="file" size={13} /></span>
      <span className="pv-name">{node.name}</span>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <AppShell current="skill"><SkillPage /></AppShell>
);
</script>
