# team_sync_import_invalid_tc3 — 非 zip 文件 → preview 400
#
# 覆盖契约：
#   - specs/tech/version_logs/v0.0.319/change_plan.md D2：zip entry 安全校验 + manifest
#     校验；handler preview 对损坏/非法 zip 返 400（InvalidZipError → 400）
#   - test-plan team_sync_import_invalid_tc3：传非 zip 文件（text）→ preview 400
#
# 设计说明：
#   - 非 zip 文件（纯文本 content）→ AdmZip 构造失败 → InvalidZipError → handler 400
#     （body 为可读错误文案）
#   - 断言 400 + 可读错误，不依赖具体文案（多语言可读错误由 UT 覆盖）
#
# 不调 LLM：纯 HTTP 错误路径，全确定性。
case: team_sync_import_invalid_tc3
module: squad
timeout: 60

steps:
  - name: preview 传文本文件 → 400 + 可读错误
    requests:
      - method: POST
        path: /squad/import?step=preview
        status: [400]
        multipart:
          file:
            filename: not-a-zip.txt
            content: "this is not a zip file, just plain text"
            content_type: text/plain
    check:
      - .error exists
