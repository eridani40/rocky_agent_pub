# workspace_file_version_tc1 — GET /session/:id/workspace/file 返回 version（v0.0.320）
#
# 覆盖契约：
#   - specs/api/version_logs/v0.0.320/change_log.md §1.1：GET file 响应新增 version
#     = `${mtimeMs}:${size}`（mtime 或 size 变化 → version 变化）；binary=1 分支不加 version
#   - specs/api/overall/04-agent-session.md §2.6.7：GET /session/:id/workspace/file?path=
#     （path 相对 workspaceDir；UTF-8 文本）
#
# 设计说明：
#   - setup 建 session（不传 workspaceDir → 后端自动建 <DATA_DIR>/workspaces/{sid>）
#     + files 原语植入 notes.md（相对 DATA_DIR 路径 workspaces/{sid}/notes.md）
#   - 断言 content + version 存在 + version 格式 `数字:数字`（~= ":" 子串验证）
#   - 重复读：两次 GET 均断言 content 一致 + version 格式稳定（AT check 引擎不支持
#     跨响应变量比较（check 右侧不插值）→ 稳定性退化为格式+内容断言；「同 mtime/size
#     派生相同 version」的确定性由 UT（session-workspace-file.test.ts）覆盖）
#
# 不调 LLM：纯 HTTP + files 原语，全确定性。
case: workspace_file_version_tc1
module: workspace
timeout: 60

setup:
  - name: 建 session（workspaceDir 自动建 <DATA_DIR>/workspaces/{sid}）
    requests:
      - method: POST
        path: /session
        body:
          title: "ws-version-tc1"
    save:
      sid: .id
    check:
      - .id exists

  - name: 植入 workspace 文件 fixture（notes.md）
    files:
      - path: "workspaces/{sid}/notes.md"
        content: { marker: "ws-version-content" }

steps:
  - name: 读文件 → 200 + content + version 存在（mtimeMs:size 格式）
    requests:
      - method: GET
        path: /session/{sid}/workspace/file?path=notes.md
    save:
      v1: .version
    check:
      - .content exists
      - .content ~= "ws-version-content"
      - .version exists
      - .version ~= ":"

  - name: 重复读 → content 一致 + version 格式稳定
    requests:
      - method: GET
        path: /session/{sid}/workspace/file?path=notes.md
    save:
      v2: .version
    check:
      - .content ~= "ws-version-content"
      - .version exists
      - .version ~= ":"

teardown:
  - name: 清理 session
    requests:
      - method: DELETE
        path: /session/{sid}
        status: [204, 404]
