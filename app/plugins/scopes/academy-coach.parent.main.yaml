# v0.0.210 scope — academy-coach:parent:main
# 参考: specs/tech/academy/[P0]session_kind_extension.md §4.1（coach scope 含 academy 3 mapper）
# extends default；显式独立成文件（后续按需分化）。
# 去 squad 相关 mappers/reminders；加 academy 3 mapper（身份 + 训练目标 + 进度）。
extends: default
scopeId: academy-coach:parent:main
name: Academy Coach Main
description: academy 教练主 session scope（教室身份 + 训练目标 + 迭代进度）

groups:
  - id: system-prompt
    points:
      - pointId: system_prompt_mapper
        impls:
          - identity
          - rules
          - tool_guidance
          - skills
          - context_files
          - memory_user
          - memory_session
          # ── academy 专属 ──
          - academy_classroom_role        # 教室身份正文（"你是 X 教室的教练"）
          - academy_coach_role            # coach 稳定职责 + 训练工作流方法论 + action 说明
          - academy_training_directive    # 训练任务 directive 透传
          - academy_iteration_state       # 当前轮次 + candidate ws 路径 + 历史摘要
      - pointId: system_reminder
        impls:
          - env
          - time
          - workspace
          - tool_error
          - todo
          - reachable_agents
